name: Daily Fantasy Refresh

on:
  schedule:
    - cron: '41 5 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      YAHOO_OAUTH_JSON_B64: ${{ secrets.YAHOO_OAUTH_JSON_B64 }}
      YAHOO_LEAGUE_KEY: ${{ secrets.YAHOO_LEAGUE_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore FanGraphs projection cache
        uses: actions/cache@v4
        with:
          path: data/2026/projections
          key: fangraphs-projections-${{ runner.os }}-${{ hashFiles('scrape_projections.py', 'scrape_pitching_projections.py', 'fangraphs_projections.py') }}
          restore-keys: |
            fangraphs-projections-${{ runner.os }}-

      - name: Run fantasy update pipeline
        run: python update_fantasy.py
